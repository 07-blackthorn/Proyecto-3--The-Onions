<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldTime - Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Encabezado centrado -->
    <header class="header">
        <h1 class="main-title">WorldTime</h1>
        <span class="subtitle">Crea tu cuenta en WorldTime</span>
    </header>

    <!-- Contenedor del registro -->
    <div class="login-container">
        <form id="registerForm" class="login-form">
            <h2>Crear Cuenta</h2>

            <div class="form-group">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" placeholder="Ingresa tu nombre completo" required>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone" placeholder="Ingresa tu teléfono" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="address">Dirección</label>
                <textarea id="address" placeholder="Ingresa tu dirección completa" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" id="registerButton" class="btn-login">Registrarse en WorldTime</button>

            <div class="register-link">
                <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión aquí</a></p>
            </div>

            <div id="message" class="message hidden"></div>
        </form>
    </div>

    <script src="register.js"></script>
</body>
</html>
